<div id="sentry-feishu-preview" aria-label="Sentry 告警卡修订稿">
  <style>
    #sentry-feishu-preview { color-scheme:light dark; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; font-size:14px; line-height:1.55; color:light-dark(#1f2329,#e5e6eb); max-width:680px; }
    #sentry-feishu-preview * { box-sizing:border-box; }
    #sentry-feishu-preview .fs-controls { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
    #sentry-feishu-preview label { display:grid; gap:4px; flex:1; min-width:180px; font-size:12px; }
    #sentry-feishu-preview select { font:inherit; font-size:14px; width:100%; padding:7px; border:1px solid light-dark(#c9cdd4,#555963); border-radius:4px; background:light-dark(#fff,#232429); color:inherit; }
    #sentry-feishu-preview .fs-caption { font-size:12px; color:light-dark(#646a73,#acafb8); margin:8px 0 12px; }
    #sentry-feishu-preview .fs-card { max-width:606px; background:light-dark(#fff,#232429); border:1px solid light-dark(#dee0e3,#484a50); border-radius:8px; overflow:hidden; }
    #sentry-feishu-preview .fs-header { padding:12px 16px; font-size:16px; font-weight:600; overflow-wrap:anywhere; }
    #sentry-feishu-preview .fs-header[data-color="red"] { background:light-dark(#fef0ef,#4c2829); color:light-dark(#b42328,#ffa2a5); }
    #sentry-feishu-preview .fs-header[data-color="orange"] { background:light-dark(#fff3e5,#49321e); color:light-dark(#8f4709,#ffbd79); }
    #sentry-feishu-preview .fs-header[data-color="green"] { background:light-dark(#e8f5e9,#243e2c); color:light-dark(#237b39,#8bdaa5); }
    #sentry-feishu-preview .fs-header[data-color="grey"] { background:light-dark(#f0f1f3,#35373d); color:light-dark(#505660,#c6c9d0); }
    #sentry-feishu-preview .fs-body { padding:16px; display:grid; gap:14px; }
    #sentry-feishu-preview .fs-text { white-space:pre-wrap; overflow-wrap:anywhere; }
    #sentry-feishu-preview .fs-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 20px; }
    #sentry-feishu-preview .fs-note { color:light-dark(#646a73,#acafb8); font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    #sentry-feishu-preview .fs-separator { margin:0; border:0; border-top:1px solid light-dark(#e5e6eb,#484a50); }
    #sentry-feishu-preview .fs-action { width:fit-content; font:inherit; padding:6px 14px; min-height:34px; background:light-dark(#fff,#232429); color:light-dark(#245bdb,#8fb1ff); border:1px solid light-dark(#245bdb,#8fb1ff); border-radius:4px; cursor:pointer; }
    #sentry-feishu-preview [hidden] { display:none!important; }
    @media(max-width:380px) { #sentry-feishu-preview .fs-fields { grid-template-columns:1fr; } }
    @media(pointer:coarse) { #sentry-feishu-preview .fs-action,#sentry-feishu-preview select { min-height:44px; } }
  </style>
  <div class="fs-controls">
    <label>场景 / Scenario<select id="sentry-scenario" aria-label="场景 / Scenario"></select></label>
    <label>客户端语言 / Client language

        <option value="zh_cn">简体中文</option>
        <option value="en_us">English</option>
        <option value="ja_jp">日本語 → English fallback</option>
      </select>
    </label>
    <label>接收群时区 / Group timezone
      <select id="sentry-group" aria-label="接收群时区 / Group timezone"></select>
    </label>
  </div>
  <div class="fs-caption">设计样例 / Synthetic examples · 飞书原生双语 · Schema 1.0</div>

    <header class="fs-header" data-color="red"></header>

  </article>

  <script>
    (() => {
      const root = document.getElementById('sentry-feishu-preview');
      const previewData = JSON.parse(root.querySelector('#sentry-card-scenarios').textContent);
      const scenes = previewData.scenes;
      const groups = previewData.groups;
      const scenario = root.querySelector('#sentry-scenario');
      const locale = root.querySelector('#sentry-locale');
      const group = root.querySelector('#sentry-group');
      const groupCaption = root.querySelector('#sentry-group-caption');
      const body = root.querySelector('.fs-body');
      const feedback = root.querySelector('.fs-feedback');
      for (const scene of scenes) {
        const option = document.createElement('option');
        option.value = scene.key;
        option.textContent = scene.name;
        scenario.append(option);
      }
      for (const item of groups) {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.label} · ${item.zone}`;
        group.append(option);
      }
      function appendText(parent, content, className) {
        const element = document.createElement('div');
        element.className = className;
        element.textContent = content;
        parent.append(element);
      }
      function render() {
        const scene = scenes.find(s => s.key === scenario.value) || scenes[0];
        if (!scene) return;
        const selectedGroup = groups.find(item => item.id === group.value) || groups[0];
        const card = scene.cardsByGroup[selectedGroup.id] || scene.card;
        const language = Object.hasOwn(card.i18n_elements, locale.value) ? locale.value : 'en_us';
        root.querySelector('.fs-header').textContent = card.header.title.i18n[language];
        root.querySelector('.fs-header').dataset.color = card.header.template;
        root.querySelector('.fs-card').lang = language === 'zh_cn' ? 'zh-CN' : 'en';
        groupCaption.textContent = language === 'zh_cn'
          ? `卡片内时间按接收群固定显示：${selectedGroup.label} · ${selectedGroup.offset}；不会跟随查看者设备时区。`
          : `Time in the card is fixed to the receiving group: ${selectedGroup.label} · ${selectedGroup.offset}; it does not follow the viewer's device timezone.`;
        body.replaceChildren();
        feedback.hidden = true;
        for (const item of card.i18n_elements[language]) {
          if (item.tag === 'div' && item.text) appendText(body, item.text.content, 'fs-text');
          if (item.tag === 'div' && item.fields) {
            const grid = document.createElement('div');
            grid.className = 'fs-fields';
            for (const field of item.fields) appendText(grid, field.text.content, 'fs-text');
            body.append(grid);
          }
          if (item.tag === 'hr') {
            const rule = document.createElement('hr');
            rule.className = 'fs-separator';
            body.append(rule);
          }
          if (item.tag === 'note') {
            for (const text of item.elements) appendText(body, text.content, 'fs-note');
          }
          if (item.tag === 'action') {
            for (const action of item.actions) {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'fs-action';
              button.textContent = action.text.content;
              button.addEventListener('click', () => {
                feedback.textContent = language === 'zh_cn'
                  ? '演示操作：正式卡片打开对应的 Sentry 详情；本预览不会发送消息或连接 Sentry。'
                  : 'Demo action: the real card opens the matching Sentry details. This preview sends no messages and does not connect to Sentry.';
                feedback.hidden = false;
              });
              body.append(button);
            }
          }
        }
      }
      scenario.addEventListener('change', render);
      locale.addEventListener('change', render);
      group.addEventListener('change', render);
      render();
    })();
  </script>
